    <title>OneDesk India – Indian Government Services Directory</title>
    <style>
      #initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #fed7aa;
        border-top-color: #FF6B35;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://onedesk-india.vercel.app/#website",
          "name": "OneDesk India",
          "alternateName": [
            "OneDesk",
            "OneDeskIndia",
            "OneDesk India Portal",
            "OneDesk Government Services"
          ],
          "url": "https://onedesk-india.vercel.app/",
          "description": "Unified single-window directory of verified Indian government service portals",
          "publisher": {
            "@id": "https://onedesk-india.vercel.app/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://onedesk-india.vercel.app/services?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://onedesk-india.vercel.app/#organization",
          "name": "OneDesk India",
          "url": "https://onedesk-india.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://onedesk-india.vercel.app/icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://onedesk-india.vercel.app/logo.png",
          "description": "Official citizen directory and single-window facilitation desk for verified Indian public portals."
        }
      ]
    }
    </script>
