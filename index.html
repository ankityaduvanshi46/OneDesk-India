    <title>OneDesk India – Indian Government Services Directory</title>
    <style>
      #initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #fed7aa;
        border-top-color: #FF6B35;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OneDesk India",
      "url": "https://onedesk-india.vercel.app",
      "description": "Unified single-window directory of verified Indian government service portals",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://onedesk-india.vercel.app/services?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader">
        <div class="preloader-spinner"></div>
        <div style="margin-top: 16px; font-weight: 800; font-size: 20px; color: #0F1B5E;">
          OneDesk <span style="color: #FF6B35;">India</span>
        </div>
        <div style="font-size: 11px; color: #6B7280; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;">
          Loading official portals...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
